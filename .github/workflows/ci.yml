name: Go Linting

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'
    - name: Download dependencies (optional)
      run: go mod download
    - name: Install golangci-lint (latest)
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    # Uncomment the following line if you want to install a specific version
    # - name: Install golangci-lint (specific version)
    #   run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.49.1
    - name: Run golangci-lint
      run: golangci-lint run