name: Go Linting and Building

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'
        
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg
        key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Get dependencies
      run: go mod tidy
    
    - name: Verify Go version
      run: go version
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libx11-dev \
          libxcursor-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxi-dev \
          libgl1-mesa-dev \
          xorg-dev
    
    - name: Install golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.47.3

    - name: Set GOROOT
      run: export GOROOT=$(go env GOROOT)
    
    - name: Create git patch
      run: |
        if git rev-parse HEAD~1 > /dev/null 2>&1; then
          git diff HEAD~1 HEAD > patch.diff
        else
          echo "No previous commit found, creating empty patch" > patch.diff
        fi

    - name: Run golangci-lint
      run: golangci-lint run -c .golangci.yml --new-from-patch patch.diff
    
    - name: Build
      run: go build -o myapp .
